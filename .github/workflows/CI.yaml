name: CD - Deploy to AKS (using raw kubeconfig)

on:
  workflow_run:
    workflows: ["CD - Deploy to aks cluster"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☸️ Step 2: Configure kubeconfig (raw secret, not base64)
      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "❌ KUBE_CONFIG secret is not set"; exit 1;
          fi
          echo "Setting up kubeconfig..."
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" > $HOME/.kube/config
          echo "✅ kubeconfig written successfully"

      # 🏗️ Step 3: Set image and deploy to AKS
      - name: Set image and deploy
        env:
          IMAGE: 3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Deploying image: $IMAGE"

          # Try updating existing deployment
          if kubectl get deployment sample-app >/dev/null 2>&1; then
            echo "Updating existing deployment..."
            kubectl set image deployment/sample-app sample-app=$IMAGE
            kubectl rollout status deployment/sample-app
          else
            echo "Creating new deployment..."
            sed -i "s|YOUR_IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml
            kubectl apply -f k8s/
          fi
