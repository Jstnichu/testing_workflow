name: CI - Build, Test, and Push to ACR (Single Registry)

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  IMAGE_NAME: sample-app
  NODE_VERSION: 18
  ACR: 3aidfacr20082025161558dev.azurecr.io   # 🔹 Single ACR for all envs

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ⚡ Step 3: Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 📦 Step 4: Install dependencies safely
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 🧪 Step 5: Run tests
      - name: Run unit tests
        run: npm test

      # 🔎 Step 6: Linting (optional)
      - name: Run lint
        run: npm run lint || echo "⚠️ Lint warnings found but not failing build."

      # 🏷️ Step 7: Determine target environment
      - name: Set environment tag
        id: env-tag
        run: |
          echo "Detecting target environment..."
          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
            echo "TAG_SUFFIX=dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "qa" ]]; then
            echo "TAG_SUFFIX=qa" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "TAG_SUFFIX=prod" >> $GITHUB_ENV
          elif [[ -n "${{ github.event.inputs.environment }}" ]]; then
            echo "TAG_SUFFIX=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "❌ Unknown branch or environment"
            exit 1
          fi

          echo "Environment tag: $TAG_SUFFIX"

      # 🔐 Step 8: Log in to the single ACR
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 🏗️ Step 9: Build and push Docker image (single ACR, multiple tags)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ env.TAG_SUFFIX }}
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:latest

      # 🧹 Step 10: Cleanup Docker cache
      - name: Cleanup
        run: docker system prune -f
      # ✅ Final step: Print success message
      - name: Print success message
        run: echo "✅ Docker image successfully built and pushed to ACR."
        id: success-message