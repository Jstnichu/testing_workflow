name: CI - Build, Test, and Push to ACR (Multi-Env)

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - main
      - qa
      - dev

env:
  IMAGE_NAME: sample-app
  NODE_VERSION: 18

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ⚡ Step 3: Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 📦 Step 4: Install dependencies safely
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 🧪 Step 5: Run tests
      - name: Run unit tests
        run: npm test

      # 🔎 Step 6 (optional): Run linting for code quality
      - name: Run lint
        run: npm run lint || echo "⚠️ Lint warnings found but not failing build."

      # 🏷️ Step 7: Determine target environment and ACR
      - name: Set environment-specific variables
        id: env-vars
        run: |
          echo "Detecting target environment..."
          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "ACR=3aidfacr-dev.azurecr.io" >> $GITHUB_ENV
            echo "TAG_SUFFIX=dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "qa" ]]; then
            echo "ENVIRONMENT=qa" >> $GITHUB_ENV
            echo "ACR=3aidfacr-qa.azurecr.io" >> $GITHUB_ENV
            echo "TAG_SUFFIX=qa" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "ACR=3aidfacr-prod.azurecr.io" >> $GITHUB_ENV
            echo "TAG_SUFFIX=prod" >> $GITHUB_ENV
          else
            echo "Unknown branch - stopping"
            exit 1
          fi

      # 🔐 Step 8: Log in to ACR
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 🏗️ Step 9: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ env.TAG_SUFFIX }}
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:latest

      # 🧹 Step 10: Cleanup Docker cache
      - name: Cleanup
        run: docker system prune -f
