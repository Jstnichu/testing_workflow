name: CD - deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI - build and push image"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then echo "KUBE_CONFIG secret is not set"; exit 1; fi
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config

      - name: Set image and deploy
        env:
          # Use the same commit SHA tag that CI pushed. This reads the head SHA from the
          # completed CI workflow run so CD only attempts to deploy an image that exists.
          IMAGE: 3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.event.workflow_run.head_sha }}
        run: |
          # Try to update existing deployment using kubectl set image (preferred) so rollout metadata is preserved.
          if kubectl get deployment sample-app >/dev/null 2>&1; then
            kubectl set image deployment/sample-app sample-app=$IMAGE || kubectl rollout restart deployment/sample-app
          else
            # Replace the placeholder in the manifest with the exact image and apply the manifests
            sed -i "s|YOUR_IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml || true
            kubectl apply -f k8s/
          fi
