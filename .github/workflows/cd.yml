name: CD - Deploy to AKS

on:
  workflow_run:
    workflows: ["CI - build and push image"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☸️ Step 2: Configure kubeconfig (raw, not base64)
      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "❌ KUBE_CONFIG secret is not set"; exit 1;
          fi
          echo "Setting up kubeconfig..."
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" > $HOME/.kube/config
          echo "✅ kubeconfig written successfully"

      # 🧱 Step 3: Set image and deploy
      - name: Deploy to AKS
        env:
          IMAGE: 3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "🚀 Deploying image: $IMAGE"

          # Check that the IMAGE variable includes a valid tag
          if [[ "$IMAGE" == *":" && "$IMAGE" == *":" ]]; then
            if [[ "$IMAGE" == *":" ]]; then
              echo "❌ IMAGE tag appears empty. Aborting."
              exit 1
            fi
          fi

          # Check if deployment exists
          if kubectl get deployment sample-app >/dev/null 2>&1; then
            echo "🔄 Updating existing deployment..."
            kubectl set image deployment/sample-app sample-app=$IMAGE
            echo "⏳ Waiting for rollout to finish..."
            kubectl rollout status deployment/sample-app --timeout=120s
          else
            echo "🆕 Creating new deployment from manifests..."
            if grep -q "YOUR_IMAGE_PLACEHOLDER" k8s/deployment.yaml; then
              sed -i "s|YOUR_IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml
            fi
            kubectl apply -f k8s/
            echo "✅ Deployment created successfully."
          fi

      # 🧪 Step 4: Verify pods are running
      - name: Verify deployment health
        run: |
          echo "🔍 Checking pods..."
          kubectl get pods -o wide
          echo "✅ Deployment complete."
