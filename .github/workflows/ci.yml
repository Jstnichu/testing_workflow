name: CI - build and push image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          # Use npm ci when a lockfile exists for a clean, reproducible install.
          # If no lockfile is present (this repo currently may not have one),
          # fall back to `npm install` which will generate package-lock.json.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found — running npm ci"
            npm ci
          else
            echo "No lockfile found — running npm install to generate package-lock.json"
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: 3aidfacr20082025161558dev.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            3aidfacr20082025161558dev.azurecr.io/sample-app:latest
            3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.sha }}
