name: CI - Build, Test, and Push Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ⚡ Step 3: Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 📦 Step 4: Install dependencies safely
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found — running npm ci"
            npm ci
          else
            echo "No lockfile found — running npm install"
            npm install
          fi
        shell: bash

      # 🧪 Step 5: Run tests
      - name: Run tests
        run: npm test

      # 🔐 Step 6: Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: 3aidfacr20082025161558dev.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 🏗️ Step 7: Build and push Docker image
      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            3aidfacr20082025161558dev.azurecr.io/sample-app:latest
            3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.sha }}

      # 🧹 Step 8 (Optional): Clean up local Docker data
      - name: Cleanup
        run: docker system prune -f
