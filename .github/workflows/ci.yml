name: CI - build and push image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: 3aidfacr20082025161558dev.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            3aidfacr20082025161558dev.azurecr.io/sample-app:latest
            3aidfacr20082025161558dev.azurecr.io/sample-app:${{ github.sha }}
